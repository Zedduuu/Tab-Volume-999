<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Volume 999</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- 轻提示（重置 / 静音等操作的短暂反馈），默认由 CSS opacity 隐藏 -->
  <div id="toast" role="status"></div>

  <main id="app">
    <!-- 顶部：当前标签页信息 + 语言切换按钮（右上角） -->
    <header>
      <div class="domain" id="tab-domain" data-i18n="tabDomainDefault"></div>
      <div class="hint" data-i18n="hintText"></div>
      <div class="lang-box">
        <button id="btn-lang" class="lang-btn" type="button" data-i18n-title="langButtonTitle">🌐</button>
        <div id="lang-menu" class="lang-menu hidden">
          <button type="button" class="lang-item" data-lang="zh_CN">简体中文</button>
          <button type="button" class="lang-item" data-lang="en">English</button>
          <button type="button" class="lang-item" data-lang="ja">日本語</button>
          <button type="button" class="lang-item" data-lang="ko">한국어</button>
        </div>
      </div>
    </header>

    <!-- 环形仪表盘 + 百分比大数字 -->
    <section class="gauge" data-i18n-aria="gaugeAria">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="gauge-track" cx="100" cy="100" r="84"></circle>
        <circle class="gauge-arc" id="gauge-arc" cx="100" cy="100" r="84"></circle>
      </svg>
      <div class="gauge-center">
        <div class="gauge-value" id="volume-value">100</div>
        <div class="gauge-unit">%</div>
      </div>
      <div class="gauge-tag" id="volume-tag" data-i18n="tagNormal"></div>
    </section>

    <!-- 滑块 + 步进按钮 -->
    <section class="controls">
      <button id="btn-minus" type="button" data-i18n-title="btnMinusTitle">−</button>
      <input id="slider" type="range" min="0" max="1000" step="1" value="500" data-i18n-aria="sliderAria">
      <button id="btn-plus" type="button" data-i18n-title="btnPlusTitle">＋</button>
    </section>
    <div class="slider-labels"><span>0%</span><span>100%</span><span>999%</span></div>

    <!-- 操作按钮 -->
    <section class="actions">
      <button id="btn-mute" type="button" class="action-btn" data-i18n="btnMute"></button>
      <button id="btn-reset" type="button" class="action-btn" data-i18n="btnReset"></button>
    </section>

    <!-- 状态栏 + 说明按钮 -->
    <footer>
      <button id="btn-info" class="info-btn" type="button" data-i18n="btnInfo"></button>
      <div id="status" class="status status-idle" data-i18n="statusConnecting"></div>
      <div class="footer-actions">
        <button id="btn-release" class="release-btn" type="button" data-i18n="btnRelease"></button>
        <button id="btn-retry" class="retry-btn hidden" type="button" data-i18n="btnRetry"></button>
      </div>
    </footer>
  </main>

  <!-- 左侧说明面板：展开时弹窗整体加宽，面板从最左侧“长出”，不遮挡主面板 -->
  <aside id="info-panel" class="info-panel" aria-hidden="true">
    <div class="info-panel-inner">
      <header class="info-panel-header">
        <span data-i18n="infoTitle"></span>
        <button id="btn-info-close" class="info-close" type="button" data-i18n-aria="infoCloseAria">✕</button>
      </header>

      <section class="info-section">
        <h3 data-i18n="infoOpsTitle"></h3>
        <div class="info-grid">
          <div class="info-row"><span class="info-keys" data-i18n="infoWheelKey"></span><span data-i18n="infoWheelStep"></span></div>
          <div class="info-row"><span class="info-keys" data-i18n="infoHoldKey"></span><span data-i18n="infoHoldStep"></span></div>
        </div>
      </section>

      <section class="info-section">
        <h3 data-i18n="infoAboutTitle"></h3>
        <ul class="info-list">
          <li data-i18n="infoAbout1"></li>
          <li data-i18n="infoAbout2"></li>
          <li data-i18n="infoAbout3"></li>
          <li data-i18n="infoAbout4"></li>
          <li data-i18n="infoAbout5"></li>
          <li data-i18n="infoAbout6"></li>
        </ul>
      </section>

      <section class="info-section">
        <h3 data-i18n="infoLatencyTitle"></h3>
        <p class="info-note" data-i18n="infoLatencyNote"></p>
        <p class="info-note mono" data-i18n="infoLatencyPipeline"></p>
        <ul class="info-list">
          <li data-i18n="infoLatency1"></li>
          <li data-i18n="infoLatency2"></li>
        </ul>
      </section>
    </div>
  </aside>

  <script src="i18n-util.js"></script>
  <script src="popup.js"></script>
</body>
</html>
